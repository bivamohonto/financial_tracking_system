                </div>

                    <label for="t1Category">Category</label>
                    <input type="text" id="t1Category" placeholder="Example: Food">
                </div>

                    <input type="text" id="t1Description" placeholder="Example: Lunch">
                </div>

                </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="t2Amount">Amount</label>
                    <input type="number" id="t2Amount" placeholder="Example: 1200">

                    <label for="t2Category">Category</label>
                    <input type="text" id="t2Category" placeholder="Example: Shopping">

                    <label for="t2Description">Description</label>
                    <input type="text" id="t2Description" placeholder="Example: T-shirt">

                    <input type="text" id="t3Description" placeholder="Example: Bus fare">
                </div>

                    <label for="t3Date">Date</label>
                    <input type="date" id="t3Date">
                </div>
            </div>

        <a href="dashboard.html" class="back-link">Back to Dashboard</a>
    </div>


    <script>
        window.onload = function () {
            const userName = localStorage.getItem("userName") || "";

            document.getElementById("monthlyIncome").value = localStorage.getItem("monthlyIncome") || "";
            document.getElementById("monthlyExpense").value = localStorage.getItem("monthlyExpense") || "";
            document.getElementById("cardHolderName").value = localStorage.getItem("cardHolderName") || userName;
            document.getElementById("cardType").value = localStorage.getItem("cardType") || "";
            document.getElementById("cardNumber").value = localStorage.getItem("cardNumber") || "";
            document.getElementById("cardSpendingLimit").value = localStorage.getItem("cardSpendingLimit") || "";

            const savedTransactions = localStorage.getItem("lastTransactions");

            if (savedTransactions) {
                const transactions = JSON.parse(savedTransactions);

                if (transactions[0]) {
                    document.getElementById("t1Amount").value = transactions[0].amount || "";
                    document.getElementById("t1Category").value = transactions[0].category || "";
                    document.getElementById("t1Description").value = transactions[0].description || "";
                    document.getElementById("t1Date").value = transactions[0].date || "";
                }

                if (transactions[1]) {
                    document.getElementById("t2Amount").value = transactions[1].amount || "";
                    document.getElementById("t2Category").value = transactions[1].category || "";
                    document.getElementById("t2Description").value = transactions[1].description || "";
                    document.getElementById("t2Date").value = transactions[1].date || "";
                }

                if (transactions[2]) {
                    document.getElementById("t3Amount").value = transactions[2].amount || "";
                    document.getElementById("t3Category").value = transactions[2].category || "";
                    document.getElementById("t3Description").value = transactions[2].description || "";
                    document.getElementById("t3Date").value = transactions[2].date || "";
                }
            }
        };

        function saveDashboardInfo() {
            const monthlyIncome = document.getElementById("monthlyIncome").value.trim();
            const monthlyExpense = document.getElementById("monthlyExpense").value.trim();

            const cardHolderName = document.getElementById("cardHolderName").value.trim();
            const cardType = document.getElementById("cardType").value;
            const cardNumber = document.getElementById("cardNumber").value.trim();
            const cardSpendingLimit = document.getElementById("cardSpendingLimit").value.trim();

            const t1Amount = document.getElementById("t1Amount").value.trim();
            const t1Category = document.getElementById("t1Category").value.trim();
            const t1Description = document.getElementById("t1Description").value.trim();
            const t1Date = document.getElementById("t1Date").value;

            const t2Amount = document.getElementById("t2Amount").value.trim();
            const t2Category = document.getElementById("t2Category").value.trim();
            const t2Description = document.getElementById("t2Description").value.trim();
            const t2Date = document.getElementById("t2Date").value;

            const t3Amount = document.getElementById("t3Amount").value.trim();
            const t3Category = document.getElementById("t3Category").value.trim();
            const t3Description = document.getElementById("t3Description").value.trim();
            const t3Date = document.getElementById("t3Date").value;

            if (
                !monthlyIncome || !monthlyExpense ||
                !cardHolderName || !cardType || !cardNumber || !cardSpendingLimit ||
                !t1Amount || !t1Category || !t1Description || !t1Date ||
                !t2Amount || !t2Category || !t2Description || !t2Date ||
                !t3Amount || !t3Category || !t3Description || !t3Date
            ) {
                alert("Please fill all information");
                return;
            }

            localStorage.setItem("monthlyIncome", monthlyIncome);
            localStorage.setItem("monthlyExpense", monthlyExpense);

            localStorage.setItem("cardHolderName", cardHolderName);
            localStorage.setItem("cardType", cardType);
            localStorage.setItem("cardNumber", cardNumber);
            localStorage.setItem("cardSpendingLimit", cardSpendingLimit);

            const transactions = [
                {
                    amount: t1Amount,
                    category: t1Category,
                    description: t1Description,
                    date: t1Date
                },
                {
                    amount: t2Amount,
                    category: t2Category,
                    description: t2Description,
                    date: t2Date
                },
                {
                    amount: t3Amount,
                    category: t3Category,
                    description: t3Description,
                    date: t3Date
                }
            ];

            localStorage.setItem("lastTransactions", JSON.stringify(transactions));
            localStorage.setItem("infoCompleted", "true");
            localStorage.setItem("loggedIn", "true");

            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
